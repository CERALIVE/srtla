name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Defaults publish to GHCR under this repository's own name. To push
    # elsewhere, set REGISTRY_URL (and optionally IMAGE_NAME) as a repository
    # variable or secret, plus the REGISTRY_USERNAME / REGISTRY_PASSWORD
    # secrets.
    env:
      REGISTRY: ${{ vars.REGISTRY_URL || secrets.REGISTRY_URL || 'ghcr.io' }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image reference
        # Docker refs must be lowercase; org and repo names need not be.
        run: echo "IMAGE=$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
