name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - stable
          - beta
        default: stable

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calver.outputs.version }}
      channel: ${{ steps.calver.outputs.channel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate CalVer version
        id: calver
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'beta' }}
        run: |
          YEAR=$(date -u +"%Y")
          MONTH=$(date -u +"%-m")
          IS_BETA=$([[ "$RELEASE_TYPE" == "beta" ]] && echo "true" || echo "false")

          PREFIX="v${YEAR}.${MONTH}"

          if [ "$IS_BETA" == "true" ]; then
            LATEST_BETA=$(git tag -l "${PREFIX}.*-beta.*" | sed -E "s/.*-beta\.([0-9]+)/\1/" | sort -n | tail -1)
            if [ -z "$LATEST_BETA" ]; then
              BETA_NUM=1
            else
              BETA_NUM=$((LATEST_BETA + 1))
            fi
            LATEST_STABLE=$(git tag -l "${PREFIX}.*" | grep -v beta | sed "s/${PREFIX}\.//" | sort -n | tail -1)
            PATCH=${LATEST_STABLE:-0}
            NEXT_PATCH=$((PATCH + 1))
            VERSION="${YEAR}.${MONTH}.${NEXT_PATCH}-beta.${BETA_NUM}"
            CHANNEL="beta"
          else
            LATEST_PATCH=$(git tag -l "${PREFIX}.*" | grep -v beta | sed "s/${PREFIX}\.//" | sort -n | tail -1)
            if [ -z "$LATEST_PATCH" ]; then
              PATCH=0
            else
              PATCH=$((LATEST_PATCH + 1))
            fi
            VERSION="${YEAR}.${MONTH}.${PATCH}"
            CHANNEL="stable"
          fi

          {
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
          } >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} (Channel: ${CHANNEL})"

  validate:
    name: Validate release
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang-tidy cmake pkg-config ccache python3-yaml

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-amd64-gcc-release-validation-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-amd64-gcc-release-validation-

      - name: Configure bounded ccache
        run: ccache -M "$CCACHE_MAXSIZE"

      - name: Check workflow contracts
        run: |
          tests/workflow-contracts.sh
          tests/workflow-contracts-negative.sh

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSRTLA_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run clang-tidy
        run: cmake --build build --target lint

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Enforce ccache bound
        if: ${{ always() }}
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -c
          fi

  build-deb:
    name: Build Debian Package (${{ matrix.arch }})
    needs: calculate-version
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ruby-dev ccache

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-gcc-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-gcc-

      - name: Configure bounded ccache
        run: ccache -M "$CCACHE_MAXSIZE"

      - name: Build srtla
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSRTLA_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j"$(nproc)"
          DESTDIR="$PWD/install" cmake --install build

      - name: Install FPM
        run: sudo gem install fpm

      - name: Create packages
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist

          # Receiver-only package: ships srtla_rec only. The C srtla_send is
          # deprecated and no longer installed (ADR-003); the device sender now
          # comes from the srtla-send-rs package, which carries its own systemd
          # unit. The sender unit is therefore not part of this payload.
          fpm -s dir -t deb \
            -n srtla \
            -v "${VERSION}" \
            -a "${ARCH}" \
            --description "SRTLA - SRT Link Aggregation receiver (srtla_rec)" \
            --maintainer "CERALIVE <contact@ceralive.com>" \
            --url "https://github.com/CERALIVE/srtla" \
            --license "AGPL-3.0" \
            -p "dist/srtla_${VERSION}_${ARCH}.deb" \
            install/usr/=/usr/

          # Create .tar.gz archive
          mkdir -p "tarball/srtla-${VERSION}"
          cp -r install/usr/* "tarball/srtla-${VERSION}/"
          cd tarball
          tar -czvf "../dist/srtla_${VERSION}_${ARCH}.tar.gz" "srtla-${VERSION}"
          cd ..

          # Create checksums
          cd dist
          sha256sum "srtla_${VERSION}_${ARCH}.deb" > "srtla_${VERSION}_${ARCH}.deb.sha256"
          sha256sum "srtla_${VERSION}_${ARCH}.tar.gz" > "srtla_${VERSION}_${ARCH}.tar.gz.sha256"

      - name: Enforce ccache bound
        if: ${{ always() }}
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -c
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: srtla-${{ matrix.arch }}
          path: |
            dist/srtla_${{ needs.calculate-version.outputs.version }}_${{ matrix.arch }}.deb
            dist/srtla_${{ needs.calculate-version.outputs.version }}_${{ matrix.arch }}.tar.gz
            dist/srtla_${{ needs.calculate-version.outputs.version }}_${{ matrix.arch }}.deb.sha256
            dist/srtla_${{ needs.calculate-version.outputs.version }}_${{ matrix.arch }}.tar.gz.sha256

  build-deb-focal:
    name: Build Ubuntu 20.04 Package (amd64)
    needs: calculate-version
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    steps:
      - name: Install Focal build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            build-essential ca-certificates ccache cmake git pkg-config ruby-dev zstd

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-focal-amd64-gcc-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-focal-amd64-gcc-

      - name: Configure bounded ccache
        run: ccache -M "$CCACHE_MAXSIZE"

      - name: Configure Focal package build
        run: |
          cmake -B build-focal -DCMAKE_BUILD_TYPE=Release -DSRTLA_BUILD_TESTS=ON \
            -DINSTALL_GTEST=OFF -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Focal package
        run: cmake --build build-focal -j"$(nproc)"

      - name: Test Focal package build
        working-directory: build-focal
        run: ctest --output-on-failure

      - name: Stage Focal package payload
        run: DESTDIR="$PWD/install-focal" cmake --install build-focal

      - name: Install FPM
        run: gem install fpm --no-document

      - name: Create Focal packages
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          mkdir -p dist

          fpm -s dir -t deb \
            -n srtla \
            -v "${VERSION}" \
            -a amd64 \
            --description "SRTLA - SRT Link Aggregation receiver (srtla_rec)" \
            --maintainer "CERALIVE <contact@ceralive.com>" \
            --url "https://github.com/CERALIVE/srtla" \
            --license "AGPL-3.0" \
            -p "dist/srtla_${VERSION}_amd64.deb" \
            install-focal/usr/=/usr/

          mkdir -p "tarball-focal/srtla-${VERSION}"
          cp -r install-focal/usr/* "tarball-focal/srtla-${VERSION}/"
          tar -C tarball-focal -czvf \
            "dist/srtla_${VERSION}_amd64.tar.gz" "srtla-${VERSION}"

          cd dist
          sha256sum "srtla_${VERSION}_amd64.deb" \
            > "srtla_${VERSION}_amd64.deb.sha256"
          sha256sum "srtla_${VERSION}_amd64.tar.gz" \
            > "srtla_${VERSION}_amd64.tar.gz.sha256"

      - name: Enforce ccache bound
        if: ${{ always() }}
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -c
          fi

      - name: Upload Focal artifact
        uses: actions/upload-artifact@v7
        with:
          name: srtla-amd64
          path: |
            dist/srtla_${{ needs.calculate-version.outputs.version }}_amd64.deb
            dist/srtla_${{ needs.calculate-version.outputs.version }}_amd64.tar.gz
            dist/srtla_${{ needs.calculate-version.outputs.version }}_amd64.deb.sha256
            dist/srtla_${{ needs.calculate-version.outputs.version }}_amd64.tar.gz.sha256

  publish:
    name: Publish receiver .deb
    needs: [calculate-version, validate, build-deb, build-deb-focal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare dist directory
        run: |
          mkdir -p dist/arm64 dist/amd64 dist/release
          mv artifacts/srtla-arm64/*.deb dist/arm64/
          mv artifacts/srtla-amd64/*.deb dist/amd64/
          cp artifacts/srtla-arm64/*.tar.gz dist/release/
          cp artifacts/srtla-amd64/*.tar.gz dist/release/
          cp artifacts/srtla-arm64/*.sha256 dist/release/
          cp artifacts/srtla-amd64/*.sha256 dist/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.calculate-version.outputs.version }}
          name: srtla v${{ needs.calculate-version.outputs.version }}
          prerelease: ${{ needs.calculate-version.outputs.channel == 'beta' }}
          files: |
            dist/arm64/*.deb
            dist/amd64/*.deb
            dist/release/*.tar.gz
            dist/release/*.sha256
          body: |
            ## srtla v${{ needs.calculate-version.outputs.version }}

            SRTLA (SRT Link Aggregation) - Bond multiple network connections for reliable streaming.

            ### Dependency Chain
            ```
            srtla (receiver-only)
              └── Server-side SRTLA ingest deployments
            ```

            ### Debian Packages
            | Architecture | Package |
            |--------------|---------|
            | ARM64 | `srtla_${{ needs.calculate-version.outputs.version }}_arm64.deb` |
            | AMD64 (Ubuntu 20.04 compatible) | `srtla_${{ needs.calculate-version.outputs.version }}_amd64.deb` |

            ### Binary Archives
            | Architecture | Archive |
            |--------------|---------|
            | ARM64 | `srtla_${{ needs.calculate-version.outputs.version }}_arm64.tar.gz` |
            | AMD64 (Ubuntu 20.04 compatible) | `srtla_${{ needs.calculate-version.outputs.version }}_amd64.tar.gz` |

            ### Installation

            **Debian/Ubuntu:**
            ```bash
            sudo dpkg -i srtla_${{ needs.calculate-version.outputs.version }}_<arch>.deb
            ```

            **Manual:**
            ```bash
            tar -xzf srtla_${{ needs.calculate-version.outputs.version }}_<arch>.tar.gz
            sudo cp -r srtla-${{ needs.calculate-version.outputs.version }}/* /usr/
            ```
